<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 408" width="100%" role="img" aria-labelledby="figD-t figD-d"><title id="figD-t">Mechanism: running-request limit against decode CUDA graph coverage</title><desc id="figD-d">Two columns of five boxes each. Stock: running limit 4,096 and graphs to 256; batches above 256 were logged without graphs; interpretation that they run eagerly and slow draining. Patched: running limit 256 equal to the graph range; batches never above 256 and always with graphs in the sampled log lines; extra requests wait. Solid boxes are logged or measured, dashed boxes are interpretation, the dotted box is a caveat.</desc><text x="175.0" y="22.0" font-size="13" text-anchor="middle" fill="#111111" font-family="Inter,Helvetica,Arial,sans-serif" font-weight="600">Stock (H100 TP=1, same pattern at TP=2)</text><rect x="10" y="36" width="330" height="54" rx="6" fill="#ffffff" stroke="#111111"/><text x="20.0" y="55.0" font-size="10.5" text-anchor="start" fill="#111111" font-family="ui-monospace,monospace">Running-request limit: 4,096 (server log).</text><text x="20.0" y="69.0" font-size="10.5" text-anchor="start" fill="#111111" font-family="ui-monospace,monospace">Decode CUDA graphs captured to batch size 256</text><text x="20.0" y="83.0" font-size="10.5" text-anchor="start" fill="#111111" font-family="ui-monospace,monospace">(server log).</text><line x1="175.0" y1="90" x2="175.0" y2="105" stroke="#5a5a55"/><path d="M171.0,99 L175.0,105 L179.0,99" fill="none" stroke="#5a5a55"/><rect x="10" y="106" width="330" height="68" rx="6" fill="#ffffff" stroke="#111111"/><text x="20.0" y="125.0" font-size="10.5" text-anchor="start" fill="#111111" font-family="ui-monospace,monospace">Saturating load (1,024 concurrent): logged</text><text x="20.0" y="139.0" font-size="10.5" text-anchor="start" fill="#111111" font-family="ui-monospace,monospace">decode batches reached 799; 15 of 131 sampled</text><text x="20.0" y="153.0" font-size="10.5" text-anchor="start" fill="#111111" font-family="ui-monospace,monospace">decode log lines show a batch above 256, all</text><text x="20.0" y="167.0" font-size="10.5" text-anchor="start" fill="#111111" font-family="ui-monospace,monospace">with cuda graph: False.</text><line x1="175.0" y1="174" x2="175.0" y2="189" stroke="#5a5a55"/><path d="M171.0,183 L175.0,189 L179.0,183" fill="none" stroke="#5a5a55"/><rect x="10" y="190" width="330" height="54" rx="6" fill="#f6f0fb" stroke="#7b2cbf" stroke-dasharray="5 3"/><text x="20.0" y="209.0" font-size="10.5" text-anchor="start" fill="#7b2cbf" font-family="ui-monospace,monospace">Interpretation: batches above 256 run eagerly.</text><text x="20.0" y="223.0" font-size="10.5" text-anchor="start" fill="#7b2cbf" font-family="ui-monospace,monospace">The eager step cost was measured on the RTX 4090</text><text x="20.0" y="237.0" font-size="10.5" text-anchor="start" fill="#7b2cbf" font-family="ui-monospace,monospace">(about 15 times a replay), not on the H100.</text><line x1="175.0" y1="244" x2="175.0" y2="259" stroke="#5a5a55"/><path d="M171.0,253 L175.0,259 L179.0,253" fill="none" stroke="#5a5a55"/><rect x="10" y="260" width="330" height="40" rx="6" fill="#ffffff" stroke="#111111"/><text x="20.0" y="279.0" font-size="10.5" text-anchor="start" fill="#111111" font-family="ui-monospace,monospace">Median time per streamed chunk 37.7 ms; median</text><text x="20.0" y="293.0" font-size="10.5" text-anchor="start" fill="#111111" font-family="ui-monospace,monospace">TTFT 2.0 s; 13,141 chunks/s (TP=1).</text><line x1="175.0" y1="300" x2="175.0" y2="315" stroke="#5a5a55"/><path d="M171.0,309 L175.0,315 L179.0,309" fill="none" stroke="#5a5a55"/><rect x="10" y="316" width="330" height="40" rx="6" fill="#f6f0fb" stroke="#7b2cbf" stroke-dasharray="5 3"/><text x="20.0" y="335.0" font-size="10.5" text-anchor="start" fill="#7b2cbf" font-family="ui-monospace,monospace">Interpretation: slower draining can keep batches</text><text x="20.0" y="349.0" font-size="10.5" text-anchor="start" fill="#7b2cbf" font-family="ui-monospace,monospace">large. Not isolated on H100.</text><text x="525.0" y="22.0" font-size="13" text-anchor="middle" fill="#111111" font-family="Inter,Helvetica,Arial,sans-serif" font-weight="600">Patched: limit defaults to graph range</text><rect x="360" y="36" width="330" height="54" rx="6" fill="#ffffff" stroke="#111111"/><text x="370.0" y="55.0" font-size="10.5" text-anchor="start" fill="#111111" font-family="ui-monospace,monospace">Running-request limit defaults to 256 = largest</text><text x="370.0" y="69.0" font-size="10.5" text-anchor="start" fill="#111111" font-family="ui-monospace,monospace">captured graph batch (server log). Graphs</text><text x="370.0" y="83.0" font-size="10.5" text-anchor="start" fill="#111111" font-family="ui-monospace,monospace">captured to 256 as in stock.</text><line x1="525.0" y1="90" x2="525.0" y2="105" stroke="#5a5a55"/><path d="M521.0,99 L525.0,105 L529.0,99" fill="none" stroke="#5a5a55"/><rect x="360" y="106" width="330" height="54" rx="6" fill="#ffffff" stroke="#111111"/><text x="370.0" y="125.0" font-size="10.5" text-anchor="start" fill="#111111" font-family="ui-monospace,monospace">Same load: logged decode batches never exceeded</text><text x="370.0" y="139.0" font-size="10.5" text-anchor="start" fill="#111111" font-family="ui-monospace,monospace">256; all 155 sampled decode log lines show cuda</text><text x="370.0" y="153.0" font-size="10.5" text-anchor="start" fill="#111111" font-family="ui-monospace,monospace">graph: True. Logged queue peaked at 768.</text><line x1="525.0" y1="160" x2="525.0" y2="175" stroke="#5a5a55"/><path d="M521.0,169 L525.0,175 L529.0,169" fill="none" stroke="#5a5a55"/><rect x="360" y="176" width="330" height="54" rx="6" fill="#f6f0fb" stroke="#7b2cbf" stroke-dasharray="5 3"/><text x="370.0" y="195.0" font-size="10.5" text-anchor="start" fill="#7b2cbf" font-family="ui-monospace,monospace">Interpretation: requests beyond 256 wait for</text><text x="370.0" y="209.0" font-size="10.5" text-anchor="start" fill="#7b2cbf" font-family="ui-monospace,monospace">admission, and active batches can stay in graph</text><text x="370.0" y="223.0" font-size="10.5" text-anchor="start" fill="#7b2cbf" font-family="ui-monospace,monospace">coverage.</text><line x1="525.0" y1="230" x2="525.0" y2="245" stroke="#5a5a55"/><path d="M521.0,239 L525.0,245 L529.0,239" fill="none" stroke="#5a5a55"/><rect x="360" y="246" width="330" height="40" rx="6" fill="#ffffff" stroke="#111111"/><text x="370.0" y="265.0" font-size="10.5" text-anchor="start" fill="#111111" font-family="ui-monospace,monospace">Median time per streamed chunk 11.1 ms; median</text><text x="370.0" y="279.0" font-size="10.5" text-anchor="start" fill="#111111" font-family="ui-monospace,monospace">TTFT 5.4 s; 16,409 chunks/s (TP=1).</text><line x1="525.0" y1="286" x2="525.0" y2="301" stroke="#5a5a55"/><path d="M521.0,295 L525.0,301 L529.0,295" fill="none" stroke="#5a5a55"/><rect x="360" y="302" width="330" height="54" rx="6" fill="#fafaf7" stroke="#5a5a55" stroke-dasharray="1.5 3"/><text x="370.0" y="321.0" font-size="10.5" text-anchor="start" fill="#5a5a55" font-family="ui-monospace,monospace">Caveat: fitting the captured range does not by</text><text x="370.0" y="335.0" font-size="10.5" text-anchor="start" fill="#5a5a55" font-family="ui-monospace,monospace">itself guarantee replay; other graph eligibility</text><text x="370.0" y="349.0" font-size="10.5" text-anchor="start" fill="#5a5a55" font-family="ui-monospace,monospace">conditions also apply.</text><rect x="10" y="386" width="14" height="10" rx="2" fill="#ffffff" stroke="#111111"/><text x="30.0" y="395.0" font-size="10" text-anchor="start" fill="#5a5a55" font-family="ui-monospace,monospace">logged or measured</text><rect x="170" y="386" width="14" height="10" rx="2" fill="#f6f0fb" stroke="#7b2cbf" stroke-dasharray="5 3"/><text x="190.0" y="395.0" font-size="10" text-anchor="start" fill="#5a5a55" font-family="ui-monospace,monospace">interpretation</text><rect x="290" y="386" width="14" height="10" rx="2" fill="#fafaf7" stroke="#5a5a55" stroke-dasharray="1.5 3"/><text x="310.0" y="395.0" font-size="10" text-anchor="start" fill="#5a5a55" font-family="ui-monospace,monospace">caveat</text></svg>